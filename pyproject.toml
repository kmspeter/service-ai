[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-ai"
version = "0.1.0"
description = "FastAPI AI server for the Agentic RAG service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.8,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "huggingface-hub>=1.3,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "minio>=7.2.20,<8.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.10,<3.0",
    "PyMuPDF>=1.25,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "qdrant-client>=1.18,<2.0",
    "starlette>=0.40,<2.0",
    "tiktoken>=0.13,<1.0",
    "urllib3>=2.2,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = [
    "infrastructure: requires local Qdrant and MinIO services",
    "llm: requires RUN_LLM_INTEGRATION_TESTS=1 and may incur cost",
    "embedding: requires RUN_EMBEDDING_INTEGRATION_TESTS=1 and may incur cost",
    "ingestion: requires RUN_INGESTION_INTEGRATION_TESTS=1 and full Phase 07 dependencies",
    "retrieval: Phase 09 dense retrieval tests against local Qdrant",
    "rag: Phase 10 pure RAG tests; provider E2E requires RUN_RAG_INTEGRATION_TESTS=1",
    "summary: Phase 11 document summary tests; provider E2E requires RUN_SUMMARY_INTEGRATION_TESTS=1",
    "query_rewrite: Phase 12 query rewrite tests; provider E2E requires RUN_QUERY_REWRITE_INTEGRATION_TESTS=1",
    "contract: internal HTTP and model contract tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
