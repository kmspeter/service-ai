[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-ai"
version = "0.1.0"
description = "FastAPI AI server for the Agentic RAG service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "huggingface-hub>=1.3,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "minio>=7.2.20,<8.0",
    "openai>=2.0,<3.0",
    "PyMuPDF>=1.25,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "qdrant-client>=1.18,<2.0",
    "tiktoken>=0.13,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "infrastructure: requires local Qdrant and MinIO services",
    "llm: requires RUN_LLM_INTEGRATION_TESTS=1 and may incur cost",
    "embedding: requires RUN_EMBEDDING_INTEGRATION_TESTS=1 and may incur cost",
    "ingestion: requires RUN_INGESTION_INTEGRATION_TESTS=1 and full Phase 07 dependencies",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
